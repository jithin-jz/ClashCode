# Template for the dev secrets. Copy to `secrets.yaml`, fill in real values,
# and DO NOT COMMIT. The real `secrets.yaml` is gitignored.
# Same split as prod: each service only receives the keys it needs.

apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
type: Opaque
stringData:
  DB_HOST: "REPLACE_WITH_DB_HOST"
  DB_PORT: "6543"
  DB_NAME: "postgres"
  DB_USER: "REPLACE_WITH_DB_USER"
  DB_PASSWORD: "REPLACE_WITH_DB_PASSWORD"
  DB_SSLMODE: "require"
  REDIS_URL: "redis://REPLACE_WITH_REDIS_ENDPOINT:6379/0"
  EXECUTOR_API_KEY: "REPLACE_WITH_EXECUTOR_API_KEY"
  EXECUTOR_SIGNING_SECRET: "REPLACE_WITH_EXECUTOR_SIGNING_SECRET"
---
apiVersion: v1
kind: Secret
metadata:
  name: executor-secrets
type: Opaque
stringData:
  EXECUTOR_API_KEY: "REPLACE_WITH_EXECUTOR_API_KEY"
  EXECUTOR_SIGNING_SECRET: "REPLACE_WITH_EXECUTOR_SIGNING_SECRET"
---
apiVersion: v1
kind: Secret
metadata:
  name: chat-secrets
type: Opaque
stringData:
  REDIS_URL: "redis://REPLACE_WITH_REDIS_ENDPOINT:6379/0"
  DYNAMODB_TABLE: "clashcode-chat-messages"
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-secrets
type: Opaque
stringData:
  INTERNAL_API_KEY: "REPLACE_WITH_INTERNAL_API_KEY"
  EXECUTOR_API_KEY: "REPLACE_WITH_EXECUTOR_API_KEY"
  EXECUTOR_SIGNING_SECRET: "REPLACE_WITH_EXECUTOR_SIGNING_SECRET"
