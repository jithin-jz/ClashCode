# Template for a manual bootstrap of the prod secrets. Copy to `secrets.yaml`,
# fill in real values, apply with `kubectl -n clashcode apply -f secrets.yaml`,
# and DO NOT COMMIT (secrets.yaml is gitignored).
#
# Preferred: External Secrets Operator (infra/k8s/external-secrets/), which builds
# these same four Secrets from AWS Secrets Manager.
#
# Each service only gets what it needs:
#   backend-secrets  -> core, Celery workers, beat, migrate job
#   executor-secrets -> executor (its own key only; never add anything else here)
#   chat-secrets     -> chat
#   ai-secrets       -> ai

apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
type: Opaque
stringData:
  # Base Config
  SECRET_KEY: "REPLACE_WITH_DJANGO_SECRET_KEY"
  DEBUG: "False"
  ENVIRONMENT: "production"
  ALLOWED_HOSTS: "REPLACE_WITH_API_HOST"  # e.g. api.clash.jithin.site — never "*"
  FRONTEND_URL: "https://clash.jithin.site"
  BACKEND_URL: "https://REPLACE_WITH_API_HOST"
  CORS_ALLOWED_ORIGINS: "https://clash.jithin.site"
  CSRF_TRUSTED_ORIGINS: "https://clash.jithin.site"
  SECURE_SSL_REDIRECT: "True"
  NUM_PROXIES: "1"  # the ALB
  DJANGO_ADMIN_URL: "REPLACE_WITH_UNGUESSABLE_PATH/"  # e.g. "ops-7f3a9c/"
  LOG_FORMAT: "json"

  # Database & Redis
  DB_HOST: "REPLACE_WITH_DB_HOST"
  DB_PORT: "5432"
  DB_NAME: "postgres"
  DB_USER: "REPLACE_WITH_DB_USER"
  DB_PASSWORD: "REPLACE_WITH_DB_PASSWORD"
  DB_SSLMODE: "require"
  # ElastiCache with AUTH + TLS (rediss://). Output of terraform: redis_url
  REDIS_URL: "rediss://:REPLACE_WITH_REDIS_AUTH_TOKEN@REPLACE_WITH_REDIS_HOST:6379/0"

  # Email Configuration
  EMAIL_BACKEND: "django.core.mail.backends.smtp.EmailBackend"
  EMAIL_HOST: "smtp.gmail.com"
  EMAIL_PORT: "587"
  EMAIL_USE_TLS: "True"
  EMAIL_HOST_USER: "REPLACE_WITH_EMAIL"
  EMAIL_HOST_PASSWORD: "REPLACE_WITH_APP_PASSWORD"
  DEFAULT_FROM_EMAIL: "CLASHCODE <REPLACE_WITH_EMAIL>"
  OTP_EMAIL_ASYNC: "true"

  # Cloudinary Configuration (required in k8s: pod filesystems are ephemeral)
  CLOUDINARY_CLOUD_NAME: "REPLACE_WITH_CLOUD_NAME"
  CLOUDINARY_API_KEY: "REPLACE_WITH_API_KEY"
  CLOUDINARY_API_SECRET: "REPLACE_WITH_API_SECRET"

  # JWT Keys (PEM)
  JWT_PUBLIC_KEY: |
    -----BEGIN PUBLIC KEY-----
    REPLACE_WITH_PUBLIC_KEY
    -----END PUBLIC KEY-----
  JWT_PRIVATE_KEY: |
    -----BEGIN RSA PRIVATE KEY-----
    REPLACE_WITH_PRIVATE_KEY
    -----END RSA PRIVATE KEY-----

  # Internal API Authentication (core <-> ai)
  INTERNAL_API_KEY: "REPLACE_WITH_INTERNAL_API_KEY"
  INTERNAL_SIGNING_SECRET: "REPLACE_WITH_INTERNAL_SIGNING_SECRET"
  INTERNAL_REQUIRE_SIGNATURE: "true"

  # Executor credentials (must match executor-secrets; different from INTERNAL_*)
  EXECUTOR_API_KEY: "REPLACE_WITH_EXECUTOR_API_KEY"
  EXECUTOR_SIGNING_SECRET: "REPLACE_WITH_EXECUTOR_SIGNING_SECRET"

  # OAuth Configuration
  GITHUB_CLIENT_ID: "REPLACE_WITH_GITHUB_CLIENT_ID"
  GITHUB_CLIENT_SECRET: "REPLACE_WITH_GITHUB_CLIENT_SECRET"
  GOOGLE_CLIENT_ID: "REPLACE_WITH_GOOGLE_CLIENT_ID"
  GOOGLE_CLIENT_SECRET: "REPLACE_WITH_GOOGLE_CLIENT_SECRET"
  GITHUB_WEBHOOK_SECRET: "REPLACE_WITH_GITHUB_WEBHOOK_SECRET"

  # Razorpay Configuration
  RAZORPAY_KEY_ID: "REPLACE_WITH_RAZORPAY_KEY_ID"
  RAZORPAY_KEY_SECRET: "REPLACE_WITH_RAZORPAY_KEY_SECRET"
  RAZORPAY_WEBHOOK_SECRET: "REPLACE_WITH_RAZORPAY_WEBHOOK_SECRET"

  # Observability
  SENTRY_DSN: ""
  SENTRY_TRACES_SAMPLE_RATE: "0.1"
  SENTRY_SEND_PII: "false"
---
apiVersion: v1
kind: Secret
metadata:
  name: executor-secrets
type: Opaque
stringData:
  EXECUTOR_API_KEY: "REPLACE_WITH_EXECUTOR_API_KEY"
  EXECUTOR_SIGNING_SECRET: "REPLACE_WITH_EXECUTOR_SIGNING_SECRET"
  SENTRY_DSN: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: chat-secrets
type: Opaque
stringData:
  JWT_PUBLIC_KEY: |
    -----BEGIN PUBLIC KEY-----
    REPLACE_WITH_PUBLIC_KEY
    -----END PUBLIC KEY-----
  REDIS_URL: "rediss://:REPLACE_WITH_REDIS_AUTH_TOKEN@REPLACE_WITH_REDIS_HOST:6379/0"
  DYNAMODB_TABLE: "clashcode-prod-chat-messages"
  AWS_REGION: "ap-south-1"  # credentials come from IRSA, never static keys
  CORS_ORIGINS: "https://clash.jithin.site"
  SENTRY_DSN: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-secrets
type: Opaque
stringData:
  INTERNAL_API_KEY: "REPLACE_WITH_INTERNAL_API_KEY"
  INTERNAL_SIGNING_SECRET: "REPLACE_WITH_INTERNAL_SIGNING_SECRET"
  EXECUTOR_API_KEY: "REPLACE_WITH_EXECUTOR_API_KEY"
  EXECUTOR_SIGNING_SECRET: "REPLACE_WITH_EXECUTOR_SIGNING_SECRET"
  GROQ_API_KEY: "REPLACE_WITH_GROQ_API_KEY"
  MODEL_NAME: "llama-3.3-70b-versatile"
  OPENAI_API_BASE: "https://api.groq.com/openai/v1"
  PINECONE_API_KEY: "REPLACE_WITH_PINECONE_API_KEY"
  PINECONE_INDEX_NAME: "clashcode"
  EMBEDDING_MODEL: "llama-text-embed-v2"
  CORS_ORIGINS: "https://clash.jithin.site"  # never "*"
  SENTRY_DSN: ""
