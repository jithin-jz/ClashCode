apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main-ingress
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: clashcode-prod-group
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:317451122305:certificate/ea73b2a3-c8e0-45f8-a58e-32b957b149d7
    # Long idle timeout for WebSockets; drop malformed headers before they reach the apps.
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=3600,routing.http.drop_invalid_header_fields.enabled=true
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    # Recommended: attach an AWS WAF web ACL (rate-based rule + managed rule groups):
    # alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:ap-south-1:317451122305:regional/webacl/...
spec:
  ingressClassName: alb
  # The AI service (/ai) and executor are internal-only and deliberately not routed here.
  rules:
    - http:
        paths:
          - path: /api/chat
            pathType: Prefix
            backend:
              service:
                name: chat-service
                port:
                  number: 8001
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: core-service
                port:
                  number: 8000
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: chat-service
                port:
                  number: 8001
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: chat-service
                port:
                  number: 8001
          - path: /media
            pathType: Prefix
            backend:
              service:
                name: core-service
                port:
                  number: 8000
          - path: /static
            pathType: Prefix
            backend:
              service:
                name: core-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: core-service
                port:
                  number: 8000
