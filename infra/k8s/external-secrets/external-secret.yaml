# One Kubernetes Secret per service, all sourced from the single AWS Secrets
# Manager JSON document `clashcode/prod/backend`. Each service only receives the
# keys it needs, so a compromise of one pod does not expose every credential.
# Every property listed here must exist in the JSON document (use "" for unused).

# core, Celery workers, beat, migrations
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-secrets
  namespace: clashcode
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: backend-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: clashcode/prod/backend
---
# executor: its own key only
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: executor-secrets
  namespace: clashcode
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: executor-secrets
    creationPolicy: Owner
  data:
    - secretKey: EXECUTOR_API_KEY
      remoteRef: {key: clashcode/prod/backend, property: EXECUTOR_API_KEY}
    - secretKey: EXECUTOR_SIGNING_SECRET
      remoteRef: {key: clashcode/prod/backend, property: EXECUTOR_SIGNING_SECRET}
    - secretKey: SENTRY_DSN
      remoteRef: {key: clashcode/prod/backend, property: SENTRY_DSN}
---
# chat: verifies JWTs, talks to Redis and DynamoDB (AWS access via IRSA)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: chat-secrets
  namespace: clashcode
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: chat-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_PUBLIC_KEY
      remoteRef: {key: clashcode/prod/backend, property: JWT_PUBLIC_KEY}
    - secretKey: REDIS_URL
      remoteRef: {key: clashcode/prod/backend, property: REDIS_URL}
    - secretKey: DYNAMODB_TABLE
      remoteRef: {key: clashcode/prod/backend, property: DYNAMODB_TABLE}
    - secretKey: AWS_REGION
      remoteRef: {key: clashcode/prod/backend, property: AWS_REGION}
    - secretKey: CORS_ORIGINS
      remoteRef: {key: clashcode/prod/backend, property: CHAT_CORS_ORIGINS}
    - secretKey: SENTRY_DSN
      remoteRef: {key: clashcode/prod/backend, property: SENTRY_DSN}
---
# ai: internal auth, executor key, LLM and vector DB
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ai-secrets
  namespace: clashcode
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: ai-secrets
    creationPolicy: Owner
  data:
    - secretKey: INTERNAL_API_KEY
      remoteRef: {key: clashcode/prod/backend, property: INTERNAL_API_KEY}
    - secretKey: INTERNAL_SIGNING_SECRET
      remoteRef: {key: clashcode/prod/backend, property: INTERNAL_SIGNING_SECRET}
    - secretKey: EXECUTOR_API_KEY
      remoteRef: {key: clashcode/prod/backend, property: EXECUTOR_API_KEY}
    - secretKey: EXECUTOR_SIGNING_SECRET
      remoteRef: {key: clashcode/prod/backend, property: EXECUTOR_SIGNING_SECRET}
    - secretKey: GROQ_API_KEY
      remoteRef: {key: clashcode/prod/backend, property: GROQ_API_KEY}
    - secretKey: MODEL_NAME
      remoteRef: {key: clashcode/prod/backend, property: MODEL_NAME}
    - secretKey: OPENAI_API_BASE
      remoteRef: {key: clashcode/prod/backend, property: OPENAI_API_BASE}
    - secretKey: PINECONE_API_KEY
      remoteRef: {key: clashcode/prod/backend, property: PINECONE_API_KEY}
    - secretKey: PINECONE_INDEX_NAME
      remoteRef: {key: clashcode/prod/backend, property: PINECONE_INDEX_NAME}
    - secretKey: EMBEDDING_MODEL
      remoteRef: {key: clashcode/prod/backend, property: EMBEDDING_MODEL}
    - secretKey: CORS_ORIGINS
      remoteRef: {key: clashcode/prod/backend, property: AI_CORS_ORIGINS}
    - secretKey: SENTRY_DSN
      remoteRef: {key: clashcode/prod/backend, property: SENTRY_DSN}
