# Requires a CNI that enforces NetworkPolicy (EKS: VPC CNI with enableNetworkPolicy,
# set in infra/terraform/modules/eks).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: executor-network-policy
spec:
  podSelector:
    matchLabels:
      app: executor
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only callers of /execute: core (API), Celery workers (code runs) and the AI agent.
    - from:
        - podSelector:
            matchLabels:
              app: core
        - podSelector:
            matchLabels:
              app: worker
        - podSelector:
            matchLabels:
              app: ai
      ports:
        - protocol: TCP
          port: 8011
  # No egress rules: learner code gets no network at all (not even DNS).
  egress: []
