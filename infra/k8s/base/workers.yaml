# One Celery worker deployment per queue so slow LLM calls (ai) can never starve
# code runs and submissions (default). Prefetch, time limits and child recycling
# are configured in project/settings.py.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-default
  labels:
    app: worker
    worker-queue: default
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: worker
      worker-queue: default
  template:
    metadata:
      labels:
        app: worker
        worker-queue: default
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: worker
        image: core:latest
        command: ["celery", "-A", "project", "worker", "--loglevel=info", "-Q", "default", "--concurrency=4", "-n", "default@%h"]
        env:
        - name: EXECUTOR_URL
          value: "http://executor-service:8011/execute"
        - name: AI_SERVICE_URL
          value: "http://ai-service:8002"
        envFrom:
        - secretRef:
            name: backend-secrets
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-ai
  labels:
    app: worker
    worker-queue: ai
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: worker
      worker-queue: ai
  template:
    metadata:
      labels:
        app: worker
        worker-queue: ai
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: worker
        image: core:latest
        # AI tasks mostly wait on the network, so more concurrency per pod is cheap.
        command: ["celery", "-A", "project", "worker", "--loglevel=info", "-Q", "ai", "--concurrency=8", "-n", "ai@%h"]
        env:
        - name: AI_SERVICE_URL
          value: "http://ai-service:8002"
        envFrom:
        - secretRef:
            name: backend-secrets
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "256Mi"
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
---
