---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beat
  labels:
    app: beat
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # Never run two schedulers at once (duplicate periodic tasks during a rollout).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: beat
  template:
    metadata:
      labels:
        app: beat
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: beat
        image: core:latest
        command: ["celery", "-A", "project", "beat", "--loglevel=info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
        envFrom:
        - secretRef:
            name: backend-secrets
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        resources:
          limits:
            cpu: "200m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
