# Runs untrusted learner code. Treat this pod as hostile:
# - only its own key (executor-secrets), never backend-secrets
# - no Kubernetes API token, no service links
# - non-root, read-only root filesystem, no capabilities, RuntimeDefault seccomp
# - deny-all egress (executor-network-policy.yaml)
# - gVisor runtime in production (infra/k8s/components/gvisor)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: executor
  labels:
    app: executor
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: executor
  template:
    metadata:
      labels:
        app: executor
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: executor
          image: executor:latest
          ports:
            - containerPort: 8011
          env:
            - name: PORT
              value: "8011"
            - name: EXECUTOR_WORK_DIR
              value: /tmp
            - name: EXECUTOR_MAX_CONCURRENT_RUNS
              value: "4"
          envFrom:
            - secretRef:
                name: executor-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: 8011
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8011
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            limits:
              cpu: "1000m"
              memory: "1Gi"
            requests:
              cpu: "250m"
              memory: "256Mi"
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: executor-service
spec:
  selector:
    app: executor
  ports:
    - protocol: TCP
      port: 8011
      targetPort: 8011
