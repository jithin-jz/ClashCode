<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- PS5 themed favicon: △ □ ✕ ○ symbols -->

  <!-- Background: deep dark like PS5 UI -->
  <rect width="512" height="512" rx="100" fill="#0a0a0f"/>

  <!-- Subtle glow overlay -->
  <radialGradient id="glow" cx="50%" cy="50%" r="60%">
    <stop offset="0%" stop-color="#6c63ff" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>
  <rect width="512" height="512" rx="100" fill="url(#glow)"/>

  <!-- Triangle △ — top center (PS5 green/teal) -->
  <polygon points="256,68 216,138 296,138" fill="none" stroke="#6edcd9" stroke-width="18" stroke-linejoin="round"/>

  <!-- Square □ — left (PS5 pink/magenta) -->
  <rect x="88" y="192" width="80" height="80" rx="10" fill="none" stroke="#e96bb0" stroke-width="18"/>

  <!-- Cross ✕ — bottom center (PS5 blue) -->
  <line x1="216" y1="330" x2="296" y2="410" stroke="#6c9eff" stroke-width="18" stroke-linecap="round"/>
  <line x1="296" y1="330" x2="216" y2="410" stroke="#6c9eff" stroke-width="18" stroke-linecap="round"/>

  <!-- Circle ○ — right (PS5 red/orange) -->
  <circle cx="384" cy="232" r="40" fill="none" stroke="#ff6b6b" stroke-width="18"/>

  <!-- Center PS orb glow -->
  <circle cx="256" cy="256" r="28" fill="#6c63ff" opacity="0.9"/>
  <circle cx="256" cy="256" r="18" fill="#a8a2ff" opacity="0.8"/>
  <circle cx="248" cy="248" r="7" fill="#ffffff" opacity="0.6"/>
</svg>
